<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>找不到頁面｜Dong Tools</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        color: #171717;
        background: #fff;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans TC",
          sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      div {
        max-width: 448px;
      }
      .eyebrow {
        margin: 0;
        color: #a3a3a3;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
      }
      h1 {
        margin: 16px 0 0;
        color: #0a0a0a;
        font-size: clamp(30px, 7vw, 38px);
        letter-spacing: -0.035em;
      }
      .copy {
        margin: 12px 0 0;
        color: #737373;
        font-size: 14px;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        margin-top: 28px;
        border-radius: 999px;
        padding: 11px 20px;
        color: white;
        background: #0a0a0a;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #262626;
      }
      a:focus-visible {
        outline: 2px solid #0a0a0a;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p class="eyebrow">404</p>
        <h1>這個工具不在這裡</h1>
        <p class="copy">
          可能移動了位置，也可能還在工作桌上。回首頁看看目前可以使用的工具。
        </p>
        <a href="/">回到所有工具</a>
      </div>
    </main>
  </body>
</html>
